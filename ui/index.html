<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG — Ask your documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" id="toggleSidebar" title="Close sidebar">&#9776;</button>
    </div>
    <div class="sidebar-content">
      <h3>Uploaded Files</h3>
      <ul id="fileList" class="file-list">
        <li class="file-empty">No files uploaded yet.</li>
      </ul>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebarTop" title="Toggle sidebar">&#9776;</button>
      <span class="topbar-title">PDF RAG</span>
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
    </header>

    <!-- Chat area -->
    <div class="chat-wrapper" id="chatWrapper">
      <!-- Welcome screen (shown when no messages) -->
      <div class="welcome" id="welcome">
        <h1 class="welcome-title">How can I help you today?</h1>
        <p class="welcome-sub">Upload a PDF and start asking questions about it.</p>

        <!-- Suggestions -->
        <div class="suggestions" id="suggestions">
          <button class="chip" onclick="useSuggestion('What is this document about?')">📄 What is this document
            about?</button>
          <button class="chip" onclick="useSuggestion('Summarize the key points')">📝 Summarize the key points</button>
          <button class="chip" onclick="useSuggestion('What are the main rules?')">📋 What are the main rules?</button>
          <button class="chip" onclick="useSuggestion('Who are the members?')">👥 Who are the members?</button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages"></div>
    </div>

    <!-- Input bar -->
    <div class="input-area">
      <div class="input-bar">
        <!-- Hidden file input -->
        <input type="file" id="fileInput" accept=".pdf,.txt,.md,.docx,.csv,.html" multiple hidden />

        <!-- Attach button -->
        <button class="attach-btn" id="attachBtn" title="Upload file">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
          </svg>
        </button>

        <input type="text" id="questionInput" class="question-input" placeholder="Type your message here..."
          autocomplete="off" />

        <!-- Send button -->
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>

      <!-- Upload status -->
      <div class="upload-status" id="uploadStatus"></div>
    </div>
  </main>

  <script src="App.js"></script>
</body>

</html>
